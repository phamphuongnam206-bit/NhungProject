[platformio]
default_envs = robot_v1

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480
build_flags = -std=gnu11 -Wall -Wextra -Werror=implicit-function-declaration -Iinclude -ffunction-sections -fdata-sections -fstack-usage
build_unflags = -std=gnu99
build_src_filter = +<*> -<motor_diag.c>

[env:robot_v1]
build_flags = ${env.build_flags} -DROBOT_PROFILE_V1=1 -Wl,-Map,robot_v1.map

[env:robot_v2]
build_flags = ${env.build_flags} -DROBOT_PROFILE_V2=1 -Wl,-Map,robot_v2.map

[env:robot_motor_diag]
build_flags = ${env.build_flags} -DROBOT_MOTOR_DIAG=1
build_src_filter = -<*> +<bsp.c> +<encoder_driver.c> +<motor_diag.c>
