[platformio]
workspace_dir = C:/PIOWork/NhungCode
default_envs = led

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
monitor_port = COM3

lib_deps =
    pololu/VL53L0X@^1.3.1

[env:led]
build_src_filter =
    -<*>
    +<main.cpp>

[env:cam_bien]
build_src_filter =
    -<*>
    +<testcambien.cpp>

[env:encoder_vlx]
build_src_filter =
    -<*>
    +<test4vl_encoder.cpp>