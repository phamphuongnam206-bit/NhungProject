
[platformio]
workspace_dir = C:/PIOWork/NhungCode
default_envs = led

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
monitor_port = COM3

lib_deps =
    pololu/VL53L0X@^1.3.1

; CHUONG TRINH 1: LED
[env:led]
build_src_filter =
    +<main.cpp>

; CHUONG TRINH 2: CAM BIEN
[env:cam_bien]
build_src_filter =
    +<testcambien.cpp>
