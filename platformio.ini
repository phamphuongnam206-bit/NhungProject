; One-run integration baseline. It stays locked until physical calibration is recorded.
[env:one_run_safe]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_flags = -DONE_RUN_CALIBRATED=0
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>

; Moc 0B: one-run candidate, telemetry only until measured calibration is approved.
[env:map_one_run]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_flags = -DONE_RUN_CALIBRATED=0 -DMAP_ONE_RUN=1
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>
