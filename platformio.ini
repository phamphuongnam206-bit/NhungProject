[platformio]
workspace_dir = C:/PIOWork/NhungCode
default_envs = hybrid_2laps

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_speed = 100
board_upload.maximum_size = 64512

monitor_speed = 115200
monitor_port = COM13

lib_deps =
    pololu/VL53L0X@^1.3.1

[env:hybrid_2laps]
monitor_speed = 38400
extra_scripts = post:tools/pio_motor_lease_check.py
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<hybrid_2laps.cpp>

; Build/link qualification only: retains the full planner but never calls it.
; Both PWM and STBY stay disabled, including stopMotors(true).
[env:hybrid_planner_check]
extends = env:hybrid_2laps
lib_deps =
    ${env.lib_deps}
    ; C11 core with per-sensor mapping; pinned for reproducible builds.
    https://github.com/haiddt0330/xe_tranh_vat_can.git#d36c524b3ae0a6c4009f875ddcefda9de39c5df8
extra_scripts = post:tools/pio_planner_check.py
build_src_flags = -flto
build_flags =
    -Wl,-u,OneRunMission_Step,-u,Planner_ReplanWithPolicy,-u,AStar_FindPathWithPolicy
    -Wl,-u,PathFollower_Compute,-u,NavigationReplan_Evaluate,-u,SensorMap_Update
    -DHYBRID_MOTOR_LOCK=1
    -DHYBRID_PLANNER_ROUTE=1
    -DHYBRID_COMPACT_DEBUG=1
    -Wl,-u,PlannerSnapshot_Build
    -Wl,-u,PlannerRuntime_Begin,-u,PlannerRuntime_Poll,-u,PlannerRuntime_Invalidate
    -Wl,-u,OneRunAdapter_Poll,-u,OneRunMission_Init,-u,OneRunFirmwareLinkProbe,-u,PlannerRoute_Sample
build_src_filter =
    -<*>
    +<hybrid_2laps.cpp>
    +<one_run_link_probe.cpp>
    +<planner_route_view.cpp>
    +<planner_snapshot.cpp>

; Qualification for the part reporting 128 KiB Flash. Keep the last 1 KiB
; outside the linker image for future page storage; no Flash write is enabled.
; The 64 KiB environment above remains the reproducible fallback.
[env:hybrid_planner_check_128k]
extends = env:hybrid_planner_check
board_upload.maximum_size = 130048
board_upload.maximum_ram_size = 20480
lib_deps =
    ${env.lib_deps}
    https://github.com/haiddt0330/xe_tranh_vat_can.git#2454ca8be28c8fedff0204a62e339cdd162d5427
build_flags =
    ${env:hybrid_planner_check.build_flags}
    -DHYBRID_PLANNER_128K=1
    -Wl,-u,NavBoot_Estimate
    -Wl,-u,StartLocalization_Estimate
build_src_filter =
    ${env:hybrid_planner_check.build_src_filter}
    +<start_localization.cpp>

; Separate V1 staging target. It inherits every qualification gate and stays
; motor-locked until physical acceptance and a reviewed future change.
[env:hybrid_v1_staging]
extends = env:hybrid_planner_check_128k
build_flags =
    ${env:hybrid_planner_check_128k.build_flags}
    -DHYBRID_V1_STAGING=1

; Manual push/turn SWD diagnostic. No motor drive, Bluetooth, UART or VL53.
[env:swd_quick_encoder_mpu]
board_upload.maximum_size = 64512
lib_deps =
build_flags = -DSWD_QUICK_MOTOR_LOCK=1 -O0 -g3
build_src_filter =
    -<*>
    +<swd_quick_encoder_mpu.cpp>

[env:do_khoang_cach]
monitor_speed = 115200
monitor_port = COM13
build_src_filter =
    -<*>
    +<dokhoangcachganhat.cpp>

[env:led]
build_src_filter =
    -<*>
    +<main.cpp>

[env:cam_bien]
monitor_speed = 115200
monitor_port = COM13
build_src_filter =
    -<*>
    +<testcambien.cpp>

[env:encoder_vlx]
build_src_filter =
    -<*>
    +<test4vl_encoder.cpp>

[env:test_encoder]
build_src_filter =
    -<*>
    +<testEncoder.cpp>

[env:test_mpu]
build_src_filter =
    -<*>
    +<testmpu.cpp>

[env:pid]
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<pid25.cpp>

[env:xe_bt]
monitor_speed = 38400
build_src_filter =
    -<*>
    +<bluetooth.cpp>

[env:map_auto]
monitor_speed = 9600
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_map_auto.cpp>

[env:pid_calibration]
monitor_speed = 115200
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<pid_calibration.cpp>

[env:pid_goc]
monitor_speed = 115200
build_src_filter =
    -<*>
    +<test_pid_goc.cpp>

[env:xe_full]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_full.cpp>
    +<bluetooth.cpp>

[env:xe_auto_test]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>

; One-run integration baseline. It stays locked until physical calibration is recorded.
[env:one_run_safe]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_flags = -DONE_RUN_CALIBRATED=0
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>

; Moc 0B: one-run candidate, telemetry only until measured calibration is approved.
[env:map_one_run]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_flags = -DONE_RUN_CALIBRATED=0 -DMAP_ONE_RUN=1
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>
