[platformio]
default_envs = hybrid_2laps

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_speed = 100
board_upload.maximum_size = 64512

monitor_speed = 115200
monitor_port = COM13

lib_deps =
    pololu/VL53L0X@^1.3.1

[env:hybrid_2laps]
monitor_speed = 38400
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<hybrid_2laps.cpp>

[env:do_khoang_cach]
monitor_speed = 115200
monitor_port = COM13
build_src_filter =
    -<*>
    +<dokhoangcachganhat.cpp>

[env:led]
build_src_filter =
    -<*>
    +<main.cpp>

[env:cam_bien]
monitor_speed = 115200
monitor_port = COM13
build_src_filter =
    -<*>
    +<testcambien.cpp>

[env:encoder_vlx]
build_src_filter =
    -<*>
    +<test4vl_encoder.cpp>

[env:test_encoder]
build_src_filter =
    -<*>
    +<testEncoder.cpp>

[env:test_mpu]
build_src_filter =
    -<*>
    +<testmpu.cpp>

[env:pid]
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<pid25.cpp>

[env:xe_bt]
monitor_speed = 38400
build_src_filter =
    -<*>
    +<bluetooth.cpp>

[env:map_auto]
monitor_speed = 9600
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_map_auto.cpp>

[env:pid_calibration]
monitor_speed = 115200
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter =
    -<*>
    +<pid_calibration.cpp>

[env:pid_goc]
monitor_speed = 115200
build_src_filter =
    -<*>
    +<test_pid_goc.cpp>

[env:xe_full]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_full.cpp>
    +<bluetooth.cpp>

[env:xe_auto_test]
monitor_speed = 38400
board_upload.maximum_size = 64512
build_src_filter =
    -<*>
    +<xe_auto_test.cpp>

[env:map_nam]
monitor_speed = 38400
build_flags =
    -DI2C_TIMEOUT_TICK=5
    -flto
build_src_filter =
    -<*>
    +<map_nam.cpp>

[env:map_static]
extends = env:map_nam
build_src_filter = -<*> +<map_static.cpp>

[env:map_static_competition]
extends = env:map_static
build_flags = ${env:map_static.build_flags} -DCOMPETITION_2_LAPS=1
